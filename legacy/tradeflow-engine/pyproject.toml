[project]
# The final release under the old distribution name. It contains no engine: it installs
# `quantred` and keeps two old surfaces working (the `tradeflow` import package, and the
# `tradeflow` command) so an existing environment, script or MCP client config does not
# break on upgrade. It lives in a different distribution from the engine on purpose - two
# distributions owning the same file means one's upgrade or uninstall deletes the other's.
name = "tradeflow-engine"
version = "2.3.1"
license = "MIT"
description = "Renamed to quantred. This final release installs quantred and keeps the old `tradeflow` import and command working."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andrew Schwartz", email = "andrew@mk-dir.com" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["quantred>=2.4,<3"]

# The same extra names as quantred (minus `dev`), each forwarding to it. A tool or venv
# installed as `tradeflow-engine[mcp]` is upgraded from its recorded request; if this
# release lacked the extra, the installer would drop it and, in an exact environment,
# remove the packages it had pulled in. tests/test_transition_package.py keeps the names equal.
[project.optional-dependencies]
optimize = ["quantred[optimize]>=2.4,<3"]
portfolio = ["quantred[portfolio]>=2.4,<3"]
mcp = ["quantred[mcp]>=2.4,<3"]
ai = ["quantred[ai]>=2.4,<3"]
openai = ["quantred[openai]>=2.4,<3"]
viz = ["quantred[viz]>=2.4,<3"]
store = ["quantred[store]>=2.4,<3"]

# The old command, now owned here rather than by the engine. No entry points are declared:
# the engine's own demo registrations live under its own groups.
[project.scripts]
tradeflow = "quantred.cli:main"

[project.urls]
Homepage = "https://github.com/makedirectory/quantred"
Documentation = "https://quantred.mk-dir.com/usage/migrating-to-quantred"
Source = "https://github.com/makedirectory/quantred"
Issues = "https://github.com/makedirectory/quantred/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradeflow"]
