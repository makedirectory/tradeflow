[project]
# The distribution name. The bare `tradeflow` is taken on PyPI by an unrelated
# package (autocorrelated time-series simulation), so the project ships as
# `tradeflow-engine` while the importable package stays `tradeflow`. Installing both
# would collide at import; nothing prevents that, so it is called out in the README.
name = "tradeflow-engine"
# Read from tradeflow/__init__.py — one place, so the packaged version and the one
# `--version` prints can never disagree.
dynamic = ["version"]
license = "MIT"
description = "A layered, broker-agnostic algorithmic-trading research engine that is honest about how hard making money is."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andrew Schwartz", email = "andrew@mk-dir.com" }]
keywords = ["trading", "backtesting", "quantitative-finance", "walk-forward", "alpaca", "mcp"]
classifiers = [
    # Experimental is the honest status: interfaces and gate thresholds may still
    # change, and the project has no production users or live capital.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "alpaca-py>=0.35",   # latest Alpaca SDK; broker/data clients
    "pandas>=2.0",
    "numpy>=1.26",
    "pytz>=2024.1",
]

[project.optional-dependencies]
# Bayesian (Gaussian-Process) parameter optimization is opt-in so the base
# install stays free of heavy ML dependencies.
optimize = ["scikit-learn>=1.4"]
# Constraint-solver portfolio allocation (Google OR-Tools).
portfolio = ["ortools>=9.8"]
# Expose TradeFlow to an agent over MCP. Opt-in; base install unchanged.
mcp = ["mcp>=1.0"]
# Autonomous research agent with Claude as the default proposer. Opt-in.
ai = ["anthropic>=0.40"]
# Use OpenAI models as the research proposer instead of Claude. Opt-in.
openai = ["openai>=1.40"]
# (Ollama needs no dependency - the research agent talks to its local HTTP API.)
# Render the demo artifact (equity curve + walk-forward verdict) to an image.
viz = ["matplotlib>=3.8"]
# Out-of-core columnar storage + lazy compute: an Arrow/Parquet bar store behind the
# scan() seam (011), plus lazy/streaming panel-wide compute over it (015 — Polars for
# dataframe transforms, DuckDB for set-based queries). Opt-in; all pure wheels, so the
# no-compiler promise holds. polars>=1.25: the streaming terminal uses
# collect(engine="streaming"), which replaced the streaming= kwarg at 1.25.
store = ["pyarrow>=14", "polars>=1.25", "duckdb>=1.0"]
dev = [
    "pytest>=8.0", "ruff>=0.6", "scikit-learn>=1.4", "ortools>=9.8", "matplotlib>=3.8",
    "pyarrow>=14", "polars>=1.25", "duckdb>=1.0",
]

[project.scripts]
# The installed entry point. `python main.py` from a checkout reaches the same
# `main`, so the two are one code path found two ways rather than two things that
# have to be kept in agreement.
tradeflow = "tradeflow.cli:main"

[project.urls]
Homepage = "https://tradeflow.mk-dir.com/"
Documentation = "https://tradeflow.mk-dir.com/"
Source = "https://github.com/makedirectory/tradeflow"
Issues = "https://github.com/makedirectory/tradeflow/issues"
Changelog = "https://tradeflow.mk-dir.com/changelog"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tradeflow/__init__.py"

[tool.hatch.build.targets.wheel]
# Only the package ships. `main.py` is a checkout convenience, and the tests, docs,
# and scripts are not something an installed copy has any use for.
packages = ["tradeflow"]

[tool.hatch.build.targets.sdist]
# The sdist carries the repo (tests and CI are useful to a packager), minus local
# state and editor/agent artifacts that have no business in a published archive.
exclude = [
    ".claude",
    ".vscode",
    ".venv",
    "logs",
    "cache",
    "configs",
    "specs",
    "website/node_modules",
    "website/build",
    "dist",
    "*.csv",
    ".env",
]

[tool.pytest.ini_options]
# Run from the repo root so `import src...` / `import tests...` resolve.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: exercises a full subprocess run (the demo end to end)"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["website"]

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), import sorting (I). Line length is owned by
# the formatter, so E501 is not enforced by the linter.
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Classify the application package as first-party so import ordering is stable
# across a local checkout and CI.
known-first-party = ["tradeflow"]
