[project]
name = "tradeflow"
version = "0.2.0"
description = "A simple, layered, broker-agnostic algorithmic trading engine (Alpaca adapter included; backtest + live)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.35",   # latest Alpaca SDK; broker/data clients
    "pandas>=2.0",
    "numpy>=1.26",
    "pytz>=2024.1",
]

[project.optional-dependencies]
# Bayesian (Gaussian-Process) parameter optimization is opt-in so the base
# install stays free of heavy ML dependencies.
optimize = ["scikit-learn>=1.4"]
# Constraint-solver portfolio allocation (Google OR-Tools).
portfolio = ["ortools>=9.8"]
# Expose TradeFlow to an agent over MCP. Opt-in; base install unchanged.
mcp = ["mcp>=1.0"]
# Autonomous research agent with Claude as the default proposer. Opt-in.
ai = ["anthropic>=0.40"]
# Use OpenAI models as the research proposer instead of Claude. Opt-in.
openai = ["openai>=1.40"]
# (Ollama needs no dependency - the research agent talks to its local HTTP API.)
dev = ["pytest>=8.0", "ruff>=0.6", "scikit-learn>=1.4", "ortools>=9.8"]

[tool.uv]
# This is an application, not a library: install dependencies only, don't build
# the project itself.
package = false

[tool.pytest.ini_options]
# Run from the repo root so `import src...` / `import tests...` resolve.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["website"]

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), import sorting (I). Line length is owned by
# the formatter, so E501 is not enforced by the linter.
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Classify the application package as first-party so import ordering is stable
# across a local checkout and CI.
known-first-party = ["src"]
