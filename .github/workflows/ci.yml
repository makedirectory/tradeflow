name: CI

on:
  # Every branch, not just main: the secret scan below is only useful if it sees a
  # push that has no pull request behind it. The expensive job stays gated to
  # main + PRs via its own `if` — see lint-and-test.
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # Unchanged behavior: pull requests, and pushes to main. A push to a topic
    # branch with a PR open would otherwise run the whole suite twice.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # The example pack registers through the same entry-point groups a user's own
      # pack does. Installing it here is what makes CI exercise that path end to end -
      # real packaging, real discovery, real contract compliance - rather than only the
      # monkeypatched fakes the registry unit tests use.
      - name: Install the example pack (exercises entry-point discovery)
        run: uv pip install --no-deps -e examples/my-signals

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Docs link check
        # Relative links and heading anchors across the docs site and top-level
        # Markdown. Note specs/ is gitignored and so is never seen here — run
        # `make check-links` locally to cover it.
        run: uv run python scripts/check_links.py

      - name: Compose config validates
        # Cheap and daemon-free: catches a malformed compose file on every PR. The
        # behavioral checks (state survives `down`, live never starts, volumes are
        # host-readable) need a daemon and live in scripts/compose_smoke.sh, run
        # locally and recorded in the PR.
        run: docker compose config --quiet

      - name: Tests (pytest)
        run: uv run pytest -q

  secret-scan:
    # The repository is public, so a committed key is disclosed the moment it
    # lands. Unlike lint-and-test this runs on *every* branch push, not only main
    # and PRs — a secret pushed to a topic branch is already public whether or not
    # anyone opens a pull request. A branch with a PR open therefore scans twice
    # (push + pull_request); at half a second a run that is not worth avoiding.
    #
    # GitHub's own secret scanning + push protection is enabled on the repo and
    # catches known provider formats before a push lands. This is the second
    # layer — it runs on forks, and it fails the build rather than only alerting
    # the owner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Everything reachable from this ref, not just the diff: a secret deleted
          # in a later commit is still readable in the one that added it, and the
          # default shallow clone hides exactly those commits.
          fetch-depth: 0

      - name: Install gitleaks
        # Pinned to an exact release rather than an action, so a scan is
        # reproducible and no third-party code runs with the workflow token.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for secrets
        # --redact keeps any match out of the public build log; the finding is in
        # the uploaded report. Exits non-zero when anything is found.
        run: gitleaks git --no-banner --redact --report-path gitleaks-report.json .

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
