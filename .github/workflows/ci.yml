name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Docs link check
        # Relative links and heading anchors across the docs site and top-level
        # Markdown. Note specs/ is gitignored and so is never seen here — run
        # `make check-links` locally to cover it.
        run: uv run python scripts/check_links.py

      - name: Tests (pytest)
        run: uv run pytest -q
