name: Release

# Publishes to PyPI when a version tag is pushed. Two properties matter here:
#
#   1. The tests run first, and a failure stops the publish. A release is the one
#      moment a broken build becomes someone else's problem permanently — PyPI
#      versions cannot be replaced, only yanked.
#   2. No API token is stored anywhere. Publishing uses PyPI's trusted publishing
#      (OIDC), so the only thing that can release is this workflow, from this
#      repository, on a tag. A leaked secret cannot publish because there is no
#      secret.
#
# Set up once at https://pypi.org/manage/project/quantred/settings/publishing/ (a new
# project name needs its own trusted publisher; the one registered for the previous
# distribution name does not carry over)
#   owner: makedirectory   repository: quantred
#   workflow: release.yml  environment: pypi
#
# A tag `v*` publishes the engine from the repository root. A tag `tradeflow-engine-v*`
# publishes the final transition release of the old distribution name from
# legacy/tradeflow-engine instead. That project's trusted publisher must name the
# repository as it is now called (`quantred`, renamed from the old one) and the same
# workflow `release.yml` and environment `pypi`.

on:
  push:
    tags: ["v*", "tradeflow-engine-v*"]
  workflow_dispatch:

jobs:
  verify:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  build:
    name: Build the distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build the engine (tag v*, or a manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/tradeflow-engine-v') }}
        run: uv build
      - name: Build the transition package (tag tradeflow-engine-v*)
        if: startsWith(github.ref, 'refs/tags/tradeflow-engine-v')
        run: uv build legacy/tradeflow-engine -o dist
      # Catches a malformed README or bad metadata before it is permanent.
      - run: uvx twine check dist/*
      # The tag and the packaged version must agree, or the release notes describe
      # something other than what was published.
      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILT=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          echo "tag=$TAG built=$BUILT"
          test "$TAG" = "$BUILT"
      - name: Tag matches the transition package's version
        if: startsWith(github.ref, 'refs/tags/tradeflow-engine-v')
        run: |
          TAG="${GITHUB_REF_NAME#tradeflow-engine-v}"
          BUILT=$(ls dist/tradeflow_engine-*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          echo "tag=$TAG built=$BUILT"
          test "$TAG" = "$BUILT"
      # PyPI cannot replace a version. Publishing this before the engine release it
      # requires exists would leave a permanent release whose dependency cannot be
      # installed, so the order of the two tags is checked, not remembered.
      - name: The engine release this requires is on PyPI
        if: startsWith(github.ref, 'refs/tags/tradeflow-engine-v')
        run: uv run --no-project --with packaging python .github/scripts/require_published_dependency.py legacy/tradeflow-engine/pyproject.toml
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token trusted publishing exchanges for an upload
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
