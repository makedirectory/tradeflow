name: Docs

# Builds the documentation site on every PR (the Docusaurus production build compiles
# every page and, with onBrokenLinks/onBrokenAnchors set to 'throw', fails on any dead
# internal link or anchor) — and deploys it on main.
#
# The deploy exists because it did not: the site was published by hand, so it silently
# fell behind the repository. A page could be written, reviewed, merged, and linked
# from the README while 404ing for every reader.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build docs (fails on broken links/anchors)
        run: npm run build

      - name: Upload the built site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/build/

  deploy:
    name: Deploy to Cloudflare
    # Only from main, and only once the build above has actually succeeded.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: docs/build/

      - name: Deploy
        # Requires CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID) as repository
        # secrets. Without them this step fails loudly rather than appearing to
        # succeed while the site stays stale — which is the failure it exists to fix.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
