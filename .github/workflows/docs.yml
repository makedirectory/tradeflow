name: Docs

# Builds the documentation site: the Docusaurus production build compiles every page
# and, with onBrokenLinks/onBrokenAnchors set to 'throw', fails on any dead internal
# link or anchor.
#
# Deploying is deliberately NOT here. Cloudflare Workers Builds deploys from Git
# directly, and a second path in this workflow would race it. What this job adds is
# the thing Cloudflare's build cannot: a failure on the *pull request*, before a
# broken page reaches main.
#
# One trap worth knowing, because it cost a stale site once: Cloudflare's build has
# its own root-directory setting, held in the dashboard rather than in this
# repository. Renaming the docs directory broke it silently — every push failed with
# "root directory not found" while nothing here went red. If this directory is ever
# renamed again, update that setting in the same change.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source: a contributor running `nvm use` and CI build
          # on the same major, and there is no second place to forget to update.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build docs (fails on broken links/anchors)
        run: npm run build
